name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start Postgres
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres

      - name: Build dev image
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build app

      - name: Lint
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm app npm run lint

      - name: Typecheck
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm app npm run typecheck

      - name: Run database migrations
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm app npm run db:migrate

      - name: Unit + integration tests
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm app npm run test:all

      - name: Compile backend
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm app npx tsc -p tsconfig.build.json

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Lint + build (in container)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm --no-deps web \
            sh -c "npm install -g npm@12.0.2 && npm ci && npm run lint && npm run build"

  docker-image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target production -t pulse-node:ci .
